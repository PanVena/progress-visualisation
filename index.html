<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поступ перекладу спілки «Ліниві ШІ»</title>
  <meta name="description" content="Інтерактивна візуалізація поступу перекладу ігор спілкою Ліниві ШІ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-deep: #05060f;
      --bg-surface: #0c0e1a;
      --bg-card: rgba(17, 19, 39, 0.7);
      --bg-card-hover: rgba(23, 26, 53, 0.9);
      --border: #1e2345;
      --border-glow: rgba(0, 240, 255, 0.6);
      --text-primary: #e8eaf6;
      --text-secondary: #8b8fb0;
      --text-dim: #5a5e80;
      --accent-translated: #00f0ff;
      --accent-translated-glow: rgba(0, 240, 255, 0.4);
      --accent-approved: #39ff14;
      --accent-approved-glow: rgba(57, 255, 20, 0.4);
      --accent-ring-bg: rgba(30, 35, 69, 0.5);
      --gradient-hero: linear-gradient(135deg, #00f0ff 0%, #6c63ff 50%, #e040fb 100%);
      --card-radius: 4px;
      --transition-smooth: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --font-mono: 'Share Tech Mono', monospace;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      background-color: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== Scanlines Overlay ===== */
    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: repeating-linear-gradient(0deg,
          rgba(0, 0, 0, 0.15),
          rgba(0, 0, 0, 0.15) 1px,
          transparent 1px,
          transparent 2px);
      pointer-events: none;
      z-index: 9999;
      opacity: 0.4;
    }

    /* ===== Particle Canvas Background ===== */
    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ===== Main Container ===== */
    .app-container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* ===== Header ===== */
    .header {
      text-align: center;
      margin-bottom: 60px;
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 3px;
      background: var(--gradient-hero);
      border-radius: 2px;
    }

    .header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: var(--gradient-hero);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
    }

    .header .date-badge {
      display: inline-block;
      font-size: 0.9rem;
      font-weight: 400;
      color: var(--text-primary);
      background: rgba(17, 19, 39, 0.8);
      border: 1px solid var(--accent-translated);
      padding: 6px 18px;
      border-radius: 2px;
      margin-top: 12px;
      font-family: var(--font-mono);
      box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .header-links {
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--text-dim);
    }

    .header-links a {
      color: var(--accent-translated);
      text-decoration: none;
      transition: color 0.3s;
    }

    .header-links a:hover {
      color: var(--accent-approved);
    }

    /* ===== Total Stats Bar ===== */
    .total-stats-bar {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 50px;
      flex-wrap: wrap;
    }

    .total-stat {
      text-align: center;
    }

    .total-stat .stat-value {
      font-size: 2.5rem;
      font-weight: 700;
      font-family: var(--font-mono);
      text-shadow: 0 0 15px currentColor;
    }

    .total-stat .stat-value.translated {
      color: var(--accent-translated);
    }

    .total-stat .stat-value.approved {
      color: var(--accent-approved);
    }

    .total-stat .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* ===== Games Grid ===== */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 28px;
      align-items: start;
    }

    .games-grid.has-active {
      grid-template-columns: 350px 1fr;
    }

    /* ===== Game Card ===== */
    .game-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 0;
      clip-path: polygon(0 15px, 15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
      overflow: hidden;
      transition: all var(--transition-smooth);
      cursor: pointer;
      position: relative;
      backdrop-filter: blur(10px);
      transform-origin: top center;
    }

    .game-card::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity var(--transition-smooth);
      background: radial-gradient(ellipse at 50% 0%, rgba(0, 240, 255, 0.1), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .game-card:hover {
      border-color: var(--accent-translated);
      transform: translateY(-4px);
      box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.15), 0 16px 48px rgba(0, 240, 255, 0.1);
    }

    .game-card:hover::before {
      opacity: 1;
    }

    .game-card-inner {
      position: relative;
      z-index: 1;
    }

    /* Card Header */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 24px 24px 0;
      transition: all 0.8s var(--transition-smooth);
    }

    .card-header-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
      min-width: 0;
      transition: all 0.8s var(--transition-smooth);
    }

    .card-icon {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      object-fit: contain;
      padding: 6px;
      border: 1px solid var(--border-glow);
      background: #1a1e38;
      flex-shrink: 0;
      transition: all 0.7s var(--transition-smooth);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text-primary);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.7s var(--transition-smooth);
    }

    .card-total-words {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text-secondary);
      padding: 0 24px 4px;
      max-height: 150px;
      opacity: 1;
      overflow: hidden;
      margin: 0;
      transition: all 0.7s var(--transition-smooth);
    }

    .card-total-words .translated-count {
      color: var(--accent-translated);
      font-weight: 600;
    }

    .card-total-words .approved-count {
      color: var(--accent-approved);
      font-weight: 600;
    }

    /* ===== Progress Rings Container ===== */
    .rings-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 32px;
      padding: 28px 24px 8px;
      max-height: 250px;
      opacity: 1;
      overflow: hidden;
      margin: 0;
      transition: all 0.7s var(--transition-smooth);
    }

    .ring-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .ring-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
    }

    .ring-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: var(--accent-ring-bg);
      stroke-width: 6;
    }

    .ring-progress {
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .ring-progress.translated {
      stroke: var(--accent-translated);
      filter: drop-shadow(0 0 6px var(--accent-translated-glow));
    }

    .ring-progress.approved {
      stroke: var(--accent-approved);
      filter: drop-shadow(0 0 6px var(--accent-approved-glow));
    }

    .ring-center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.1;
      font-family: var(--font-mono);
      text-shadow: 0 0 8px currentColor;
    }

    .ring-center-text.translated {
      color: var(--accent-translated);
    }

    .ring-center-text.approved {
      color: var(--accent-approved);
    }

    .ring-center-text .unit {
      display: block;
      font-size: 0.55rem;
      font-weight: 400;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 2px;
      opacity: 0.8;
    }

    .ring-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-dim);
    }

    /* ===== Sections Expanding Panel ===== */
    .sections-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 1.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .game-card.expanded .sections-panel {
      max-height: 1000px;
    }

    .sections-inner {
      padding: 0 24px 24px;
    }

    .section-divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }

    .section-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
    }

    .section-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      flex: 0 0 160px;
    }

    .section-bars {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .section-bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 20px;
    }

    .section-label {
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.5);
      min-width: 105px;
      text-align: right;
      white-space: nowrap;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .section-bar-track {
      flex: 1;
      height: 6px;
      background: var(--accent-ring-bg);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .section-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      min-width: 0;
    }

    .section-bar-fill.translated {
      background: linear-gradient(90deg, #6c63ff, #8b7dff);
    }

    .section-bar-fill.approved {
      background: linear-gradient(90deg, #00e5a0, #40ffca);
    }

    .section-pct {
      font-size: 0.7rem;
      font-weight: 600;
      min-width: 45px;
      text-align: right;
    }

    .section-pct.translated {
      color: var(--accent-translated);
    }

    .section-pct.approved {
      color: var(--accent-approved);
    }

    .section-counts {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-align: right;
      min-width: 100px;
      flex-shrink: 0;
    }

    /* ===== Expand Toggle ===== */
    .expand-hint {
      display: flex;
      justify-content: center;
      padding: 12px 0 20px;
      max-height: 100px;
      opacity: 1;
      overflow: hidden;
      margin: 0;
      transition: all 0.7s var(--transition-smooth);
    }

    .expand-chevron {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: var(--text-dim);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform var(--transition-smooth), stroke var(--transition-smooth);
    }

    .game-card:hover .expand-chevron {
      stroke: var(--accent-translated);
    }

    .game-card.expanded .expand-chevron {
      transform: rotate(180deg);
      stroke: var(--accent-translated);
    }



    /* ===== Credit ===== */
    .credit {
      text-align: center;
      margin-top: 60px;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .credit a {
      color: var(--accent-translated);
      text-decoration: none;
      transition: color 0.3s;
    }

    .credit a:hover {
      color: var(--accent-approved);
    }

    /* ===== Responsive ===== */
    @media (max-width: 720px) {
      .header h1 {
        font-size: 1.6rem;
      }

      .games-grid {
        grid-template-columns: 1fr;
      }

      .total-stats-bar {
        gap: 20px;
      }

      .total-stat .stat-value {
        font-size: 1.4rem;
      }

      .rings-container {
        gap: 20px;
      }

      .ring-wrapper {
        width: 80px;
        height: 80px;
      }

      .ring-center-text {
        font-size: 0.9rem;
      }

      .section-row {
        flex-wrap: wrap;
      }

      .section-name {
        flex: 0 0 100%;
        margin-bottom: 4px;
      }

      .section-counts {
        min-width: 100%;
        text-align: left;
        margin-top: 4px;
      }
    }

    /* ===== Animations ===== */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .game-card {
      opacity: 0;
      animation: fadeInUp 0.6s ease forwards;
    }

    /* ===== Master Detail View States ===== */
    .games-grid.has-active .game-card {
      grid-column: 1;
    }

    .games-grid.has-active .game-card.active {
      grid-column: 2;
      grid-row: 1 / span 100;
    }

    /* Non-active cards in sidebar become mini */
    .games-grid.has-active .game-card:not(.expanded) .rings-container,
    .games-grid.has-active .game-card:not(.expanded) .card-total-words,
    .games-grid.has-active .game-card:not(.expanded) .expand-hint,
    .games-grid.has-active .game-card:not(.expanded) .sections-panel,
    .games-grid.has-active .game-card:not(.expanded) .game-desc-panel {
      max-height: 0 !important;
      opacity: 0;
      padding-top: 0 !important;
      padding-bottom: 0 !important;
      margin: 0 !important;
      overflow: hidden;
      pointer-events: none;
    }

    .games-grid.has-active .game-card:not(.expanded) .card-header {
      padding: 16px;
    }

    .games-grid.has-active .game-card:not(.expanded) .card-icon {
      width: 48px;
      height: 48px;
    }

    .sidebar-mini-bars {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      margin-top: 0;
    }

    .games-grid.has-active .game-card:not(.expanded) .sidebar-mini-bars {
      max-height: 50px;
      opacity: 1;
      margin-top: 8px;
      transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.7s;
    }

    /* Game Description Native Panel */
    .game-desc-panel {
      padding: 0 24px;
      font-size: 1.05rem;
      color: var(--text-secondary);
      line-height: 1.6;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: all 1.0s;
      white-space: pre-line;
      border-bottom: 1px solid transparent;
    }

    .game-card.active .game-desc-panel {
      max-height: 1500px;
      opacity: 1;
      padding-bottom: 24px;
      border-bottom-color: var(--border);
      margin-bottom: 16px;
      transition: max-height 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 1.0s ease 0.4s;
    }

    /* Active Card styling tweaks */
    .game-card.active .card-header {
      flex-direction: column;
      align-items: center;
      padding-top: 40px;
      padding-bottom: 24px;
    }

    .game-card.active .card-header-left {
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .game-card.active .card-icon {
      width: 150px;
      height: 150px;
      margin-bottom: 24px;
      border-radius: 32px;
      padding: 12px;
    }

    .game-card.active .card-title {
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    .game-card.active .expand-hint {
      display: none;
    }

    .game-card.active {
      border-color: var(--accent-translated);
      box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.1), 0 16px 48px rgba(0, 240, 255, 0.1);
    }

    .game-card.expanded .expand-chevron {
      transform: rotate(180deg);
      stroke: var(--accent-translated);
    }

    /* Collapse Arrow (for active card) */
    .collapse-arrow {
      position: absolute;
      top: 8px;
      left: 0;
      right: 0;
      height: 32px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      opacity: 0.3;
      transition: all 0.3s ease;
      border-radius: 12px 12px 0 0;
    }

    .game-card.active .collapse-arrow {
      display: flex;
    }

    .collapse-arrow:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.05);
      padding-top: 4px;
    }

    .collapse-arrow svg {
      width: 28px;
      height: 28px;
      stroke: var(--text-dim);
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .header-links {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .header-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(17, 19, 39, 0.6);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 10px 20px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .header-pill::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), transparent);
      z-index: 1;
    }

    .header-pill:hover {
      transform: translateY(-3px) scale(1.02);
      border-color: var(--accent-translated);
      box-shadow: 0 8px 24px rgba(0, 240, 255, 0.2);
      color: var(--accent-translated);
    }

    .header-pill svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      z-index: 2;
    }

    .header-pill span {
      z-index: 2;
    }

    .header-pill.mono {
      background: linear-gradient(135deg, #ffde00, #ffc400);
      color: #000;
      border-color: transparent;
      box-shadow: 0 6px 15px rgba(255, 222, 0, 0.3);
      padding: 14px 32px;
      font-size: 1rem;
      margin-top: 8px;
    }

    .header-pill.mono:hover {
      background: linear-gradient(135deg, #fff100, #ffd200);
      border-color: transparent;
      box-shadow: 0 12px 30px rgba(255, 222, 0, 0.5);
      color: #000;
      transform: translateY(-5px) scale(1.06);
    }

    .header-pill.mono svg {
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
    }

    /* ===== Frozen / Frost Effect ===== */
    .game-card.frozen {
      border-color: #7dd3fc !important;
      /* Sky 300 */
      background: linear-gradient(135deg, rgba(186, 230, 253, 0.15), rgba(224, 242, 254, 0.05)) !important;
      box-shadow: inset 0 0 30px rgba(125, 211, 252, 0.1), 0 0 15px rgba(125, 211, 252, 0.1) !important;
      overflow: hidden;
    }

    .game-card.frozen::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    .game-card.frozen .card-icon {
      filter: grayscale(0.6) brightness(1.2) sepia(0.2) hue-rotate(180deg);
      border-color: rgba(125, 211, 252, 0.3);
    }

    .frozen-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(12, 74, 110, 0.8);
      /* Sky 900 */
      color: #7dd3fc;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #7dd3fc;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 4px;
      z-index: 10;
      box-shadow: 0 0 10px rgba(125, 211, 252, 0.3);
    }

    .game-card.active.frozen {
      box-shadow: inset 0 0 40px rgba(125, 211, 252, 0.2), 0 20px 60px rgba(125, 211, 252, 0.2) !important;
    }

    /* Responsive tweaks for master-detail */

    (function initParticles() {
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      const PARTICLE_COUNT = 80;
      const CONNECTION_DIST = 140;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.vx = (Math.random() - 0.5) * 0.3;
          this.vy = (Math.random() - 0.5) * 0.3;
          this.r = Math.random() * 1.5 + 0.5;
          this.alpha = Math.random() * 0.4 + 0.1;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
          if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(108, 99, 255, ${this.alpha})`;
          ctx.fill();
        }
      }

      for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particles.length; i++) {
          particles[i].update();
          particles[i].draw();
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < CONNECTION_DIST) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              const alpha = (1 - dist / CONNECTION_DIST) * 0.08;
              ctx.strokeStyle = `rgba(108, 99, 255, ${alpha})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();

    function createRingSVG(percent, type, size = 100) {
      const r = (size / 2) - 6;
      const circumference = 2 * Math.PI * r;
      const offset = circumference * (1 - percent / 100);
      return `
    <svg class="ring-svg" viewBox="0 0 ${size} ${size}">
      <circle class="ring-bg" cx="${size / 2}" cy="${size / 2}" r="${r}" />
      <circle class="ring-progress ${type}" cx="${size / 2}" cy="${size / 2}" r="${r}"
        stroke-dasharray="${circumference}"
        stroke-dashoffset="${circumference}"
        data-target-offset="${offset}" />
    </svg>
  `;
    }

    function calcOverall(sections) {
      const included = sections.filter(s => !s.exclude_from_total);
      const total = included.reduce((a, s) => a + s.total, 0);
      const translated = included.reduce((a, s) => a + s.translated, 0);
      const approved = included.reduce((a, s) => a + s.approved, 0);
      return { total, translated, approved };
    }

    function renderCard(game, index) {
      const isFrozen = game.frozen === true;
      const sections = game.sections || [];
      const { total, translated, approved } = calcOverall(sections);
      const transPct = total > 0 ? (translated / total * 100) : 0;
      const apprPct = total > 0 ? (approved / total * 100) : 0;

      const iconSrc = game.icon || '';

      // Sections HTML
      let sectionsHTML = '';
      for (const sec of sections) {
        const t = sec.total;
        const tr = sec.translated;
        const ap = sec.approved;
        const tPct = t > 0 ? (tr / t * 100) : 0;
        const aPct = t > 0 ? (ap / t * 100) : 0;
        const tLabel = sec.translated_label || 'Перекладено';
        const aLabel = sec.approved_label || 'Затверджено';

        sectionsHTML += `
      <div class="section-row">
        <span class="section-name">${sec.name}</span>
        <div class="section-bars">

      card.addEventListener('click', () => {
        const grid = document.getElementById('games-grid');
        const allCards = Array.from(document.querySelectorAll('.game-card'));
        const isTurningOff = card.classList.contains('active');

        // Remove any previous transforms cleanly
        allCards.forEach(c => {
          c.style.transition = 'none';
          c.style.transform = '';
        });

        // 1. First Layer Rect
        const firstRects = new Map();
        allCards.forEach(c => firstRects.set(c, c.getBoundingClientRect()));

        // 2. DOM Swaps (Instant Size/Shape Changes)
        allCards.forEach(c => c.classList.remove('active', 'expanded'));
        if (isTurningOff) {
          grid.classList.remove('has-active');
        } else {
          card.classList.add('active');
          grid.classList.add('has-active');
        }

        // Force layout flush so we can measure the NEW layout!
        void grid.offsetHeight;

        // 3. Last & Invert calculation
        allCards.forEach(c => {
          const first = firstRects.get(c);
          const last = c.getBoundingClientRect();
          const deltaX = first.left - last.left;
          const deltaY = first.top - last.top;

          // Invert
          c.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
        });

        // 4. Play Slide Animation
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            allCards.forEach(c => {
              c.style.transition = 'transform 0.8s cubic-bezier(0.68, -0.1, 0.265, 1.2)';
              c.style.transform = '';
              setTimeout(() => { c.style.transition = ''; }, 800);
            });

            if (!isTurningOff) {
              card.classList.add('expanded');
              requestAnimationFrame(() => animateBars(card));

              // Focus on the card: scroll it into view smoothly
              setTimeout(() => {
                card.scrollIntoView({ behavior: 'smooth', block: 'start' });
              }, 100);
            }
          });
        });
      });

      return card;

          circle.style.strokeDashoffset = target;
        });
      });

      fills.forEach(fill => {
        const target = fill.getAttribute('data-target-width');
        fill.style.width = `${Math.max(parseFloat(target), 0)}%`;

        grandApproved += approved;

      const grandTransPct = grandTotal > 0 ? (grandTranslated / grandTotal * 100) : 0;
      const grandApprPct = grandTotal > 0 ? (grandApproved / grandTotal * 100) : 0;

      document.getElementById('total-stats-bar').innerHTML = `
    <div class="total-stat">
      <div class="stat-value translated">${grandTransPct.toFixed(1)}%</div>

    <div class="total-stat">
      <div class="stat-value approved">${grandApprPct.toFixed(1)}%</div>
      <div class="stat-label">Затверджено загалом</div>
    </div>
    <div class="total-stat">
      <div class="stat-value" style="color:var(--text-primary)">${data.length}</div>
      <div class="stat-label">${pluralize(data.length, 'проєкт', 'проєкти', 'проєктів')}</div>
    </div>
    <div class="total-stat">
      <div class="stat-value" style="color:var(--text-primary)">${grandTotal.toLocaleString('uk')}</div>
      <div class="stat-label">${pluralizeUnit(grandTotal, 'слів')} загалом</div>
    </div>
  `;

      // Render cards
      const grid = document.getElementById('games-grid');
      data.forEach((game, i) => {
        const card = renderCard(game, i);
        grid.appendChild(card);
      });

      // Animate rings and bars after cards are in DOM
      requestAnimationFrame(() => {
        setTimeout(() => {
          animateRings(document);
          animateBars(document);
        }, 200);
      });
    }

    init();


  </script>
</body>

</html>
